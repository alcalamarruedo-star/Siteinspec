<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173550"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>SiteInspect</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#173550;font:16px system-ui}header{background:#173550;color:white;padding:18px;font-weight:700}main{max-width:1000px;margin:auto;padding:12px}section{background:white;border-radius:12px;padding:14px;margin-bottom:12px}button,input,select,textarea{font:inherit;padding:11px;border:1px solid #aab9c7;border-radius:7px;max-width:100%}button{background:#173550;color:white;min-height:44px}button.alt{background:white;color:#173550}label{display:block;margin:10px 0}input:not([type=file]),textarea,select{width:100%}textarea{min-height:80px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:1}#viewport{overflow:auto;max-height:65vh;background:#dce4eb;touch-action:pan-x pan-y}#drawing{position:relative;line-height:0}#plan{width:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;min-height:32px;width:32px;padding:0;font-weight:bold;line-height:28px}.thumb{width:100px;max-height:100px;object-fit:contain}small{color:#52677c}h2{font-size:19px;margin:0 0 10px}#notice{padding:8px;white-space:pre-wrap} [hidden]{display:none!important}</style></head><body><header>SiteInspect · v1.2</header><main><div id="notice" role="status">Opening local storage…</div><section><h2>Projects</h2><div class="row"><select id="projects" aria-label="Project"></select><button id="newProject">New project</button></div><label>Project number<input id="projectNo"></label><label>Inspection report number<input id="reportNo"></label><label>Company logo (stored locally)<input id="logo" type="file" accept="image/png,image/jpeg"></label><label>Distribution list (one line per recipient: name | company | Action or Copy)<textarea id="distribution"></textarea></label><label><input id="appendix" type="checkbox" checked> Include drawing appendix</label><label>Inspector<input id="inspector" placeholder="Engineer name"></label><label>Inspection date<input id="date" type="date"></label><div class="row"><button id="backup" class="alt">Backup</button><label>Restore backup<input id="restore" type="file" accept=".json"></label></div></section><div id="work" hidden><section><h2>Drawings</h2><label>Upload PDF or image<input id="upload" type="file" accept="application/pdf,image/*"></label><select id="drawings" aria-label="Drawing"></select><div class="row"><button id="minus" class="alt">− Zoom</button><button id="plus" class="alt">+ Zoom</button><button id="mode">Add pin: off</button></div><p><small>Turn on Add pin, then tap the drawing. Scroll to pan. Use zoom buttons to enlarge.</small></p><div id="viewport"><div id="drawing"><img id="plan" alt="Selected drawing"></div></div></section><section id="editor" hidden><h2 id="obsTitle"></h2><label>Discipline<select id="discipline"><option>Mechanical</option><option>Electrical</option></select></label><label>Observation<textarea id="description"></textarea></label><label>Corrective action<textarea id="action"></textarea></label><label>Status<select id="status"><option>Open issue</option><option>Work in progress</option><option>Complete</option><option>General observation</option></select></label><label>Priority<select id="priority"><option>Medium</option><option>High</option><option>Low</option><option>Information</option></select></label><label>Take photo<input id="camera" type="file" accept="image/*" capture="environment"></label><label>Choose photos<input id="photos" type="file" accept="image/*" multiple></label><div id="thumbs"></div><div class="row"><button id="save">Save observation</button><button id="remove" class="alt">Delete</button></div></section><section><h2>Observations</h2><div id="list"></div><div class="row"><button id="word">Export Word (.docx)</button><button id="print" class="alt">Printable report / PDF</button></div></section></div></main><script type="module" src="app.js"></script></body></html>
